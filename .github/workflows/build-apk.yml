name: Gerar APK CbOfertas V12.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar JavaScript
        run: |
          node --check android/app/src/main/assets/www/app.js
          node --check backend/src/server.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        run: gradle clean :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CbOfertas-V12.1.apk
          sha256sum CbOfertas-V12.1.apk > CbOfertas-V12.1.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CbOfertas-V12.1-APK
          path: |
            CbOfertas-V12.1.apk
            CbOfertas-V12.1.apk.sha256
          retention-days: 30
