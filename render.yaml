services:
  - type: web
    name: cbofertas-v6-api
    runtime: node
    plan: free
    branch: v6-rebuild
    rootDir: backend
    buildCommand: npm test
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MELI_SITE_ID
        value: MLB
      - key: MELI_ACCESS_TOKEN
        sync: false
